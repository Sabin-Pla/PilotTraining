[package]
name = "webgl"
version = "0.1.0"
edition = "2021"

[profile.release]
debug = true

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
wasm-bindgen-test = "0.2"

[dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3.70"
wasm-bindgen = "0.2.93"
glam = "0.29.0"
fontdue = "0.9.2"
web-sys = { version = "0.3.70", features = [
 	'console',
	'Document',
	'DedicatedWorkerGlobalScope',
	'Element',
	'EventTarget',
	'HtmlElement',
	'HtmlCanvasElement',
	'KeyboardEvent',
	'WebGlBuffer',
	'WebGlVertexArrayObject',
	'WebGl2RenderingContext',
	'WebGlProgram',
	'WebGlShader',
	'Window',
	'CanvasRenderingContext2d',
	'CssStyleDeclaration',
	'WebGlContextAttributes',
	'MouseEvent',
	'WebGlTexture',
	'WebGlUniformLocation'
] }
